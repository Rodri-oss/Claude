<title>華語 Taiwan Tutor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one mobile column, sticky header, bottom tab bar. Same identity as the full app: paper, ink, vermilion seal red. */
:root {
  --paper: #faf8f4; --card: #ffffff; --ink: #1d1b18; --ink-2: #57534c; --muted: #8b867c; --line: #e6e1d7;
  --accent: #c8372d; --accent-ink: #ffffff; --accent-soft: #fbe9e6; --jade: #1f7a5c; --jade-soft: #e3f3ec; --warn-soft: #fff4dc;
  --t1: #d9363e; --t2: #d97a00; --t3: #2b8a3e; --t4: #1971c2; --t5: #7a7a80;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --grid: #e1e0d9; --axis: #c3c2b7;
  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-han: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #151412; --card: #1f1d1a; --ink: #f1eee8; --ink-2: #c4bfb4; --muted: #8f8a80; --line: #34312c;
  --accent: #e0564b; --accent-soft: #3a1f1c; --jade: #4cc293; --jade-soft: #173328; --warn-soft: #3a3020;
  --t1: #ff6b6b; --t2: #ffa94d; --t3: #69db7c; --t4: #4dabf7; --t5: #a6a6ad;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --grid: #2c2c2a; --axis: #383835; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #151412; --card: #1f1d1a; --ink: #f1eee8; --ink-2: #c4bfb4; --muted: #8f8a80; --line: #34312c;
  --accent: #e0564b; --accent-soft: #3a1f1c; --jade: #4cc293; --jade-soft: #173328; --warn-soft: #3a3020;
  --t1: #ff6b6b; --t2: #ffa94d; --t3: #69db7c; --t4: #4dabf7; --t5: #a6a6ad;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --grid: #2c2c2a; --axis: #383835; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--font-ui); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.han, [lang="zh-TW"] { font-family: var(--font-han); }
h1 { font-size: 1.6rem; margin: 0 0 4px; line-height: 1.25; text-wrap: balance; }
h2 { font-size: 1rem; margin: 0; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 36rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 6px; font-weight: 600; font-size: .9rem; }
.brand .han { color: var(--accent); font-weight: 700; font-size: 1.15rem; }
.head-r { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.toggle { border: 1px solid var(--line); background: var(--card); color: var(--ink-2); border-radius: 999px; padding: 3px 10px; font-size: .75rem; font-weight: 600; }
.toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
#sync { font-size: .7rem; color: var(--muted); }
#sync[data-state="account"] { color: var(--jade); }
#view { display: flex; flex-direction: column; gap: 14px; padding-block: 16px 110px; }

nav { position: fixed; inset: auto 0 0; z-index: 20; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--paper) 95%, transparent); backdrop-filter: blur(8px); padding-bottom: max(env(safe-area-inset-bottom, 0px), 6px); }
nav .wrap { display: flex; justify-content: space-around; padding-top: 6px; }
nav a { display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: .7rem; color: var(--muted); padding: 2px 8px; min-width: 52px; }
nav a .ic { font-family: var(--font-han); font-size: 1.15rem; line-height: 1.2; }
nav a.active { color: var(--accent); font-weight: 600; }

.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel.flush { padding: 0; gap: 0; overflow: hidden; }
.panel-head, .spread { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.center { text-align: center; justify-content: center; }
.grow { flex: 1; min-width: 0; }
.push { margin-left: auto; }
.block { display: block; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.num { font-variant-numeric: tabular-nums; }
.pad { padding: 24px; }
.left { text-align: left; }
.link { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.label { font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.ok { color: var(--jade); font-weight: 700; }
.bad { color: var(--t1); font-weight: 700; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 12px; padding: 10px 16px; font-weight: 600; border: 1px solid transparent; }
.btn.sm { padding: 6px 12px; font-size: .85rem; border-radius: 10px; }
.btn.big { padding: 14px 22px; font-size: 1.05rem; border-radius: 999px; }
.btn.wide { width: 100%; padding: 14px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.dark { background: var(--ink); color: var(--paper); }
.btn.ghost { border-color: var(--line); background: var(--card); }
.btn.danger { background: var(--t1); color: #fff; }
.chip { border: 1px solid var(--line); background: var(--card); color: var(--ink-2); border-radius: 999px; padding: 5px 12px; font-size: .82rem; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip.on .muted { color: inherit; opacity: .7; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-inline: -4px; padding-inline: 4px; }
.play { flex-shrink: 0; width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 1rem; display: inline-flex; align-items: center; justify-content: center; }
.play.sm { width: 32px; height: 32px; font-size: .8rem; }
.play.huge { width: 84px; height: 84px; font-size: 1.8rem; box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent); }
.play:active, .btn:active, .rate:active { transform: scale(.97); }
.badge { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: .7rem; color: var(--ink-2); }
.badge.level { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.badge.new { background: var(--t4); color: #fff; border-color: transparent; font-weight: 700; }
.callout { background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; font-size: .9rem; display: flex; flex-direction: column; gap: 8px; }
.note { border-radius: 12px; padding: 8px 12px; font-size: .85rem; }
.note.good { background: var(--jade-soft); color: var(--jade); }
.note.warn { background: var(--warn-soft); color: var(--ink-2); }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.tile-label { font-size: .75rem; color: var(--ink-2); }
.tile-value { font-size: 1.9rem; font-weight: 700; line-height: 1.2; }
.tile-value span { font-size: .85rem; font-weight: 500; color: var(--muted); }
.plan { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
.plan li { display: flex; gap: 10px; align-items: center; }
.step { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; font-size: .8rem; font-weight: 700; border: 1px solid var(--line); color: var(--ink-2); }
.step.done { background: var(--jade); border-color: var(--jade); color: #fff; }
.progress, .bar { display: block; height: 6px; background: color-mix(in srgb, var(--line) 70%, transparent); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.progress span { display: block; height: 100%; background: var(--jade); border-radius: 99px; }
.bar { flex: 1; height: 10px; margin: 0; }
.bar span { display: block; height: 100%; border-radius: 99px; }
.acc, .levels { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.acc li, .levels li { display: flex; align-items: center; gap: 8px; font-size: .88rem; }
.acc-name { width: 60px; text-transform: capitalize; }
.acc-val { width: 82px; text-align: right; font-variant-numeric: tabular-nums; }
.levels li > span:first-child { width: 72px; }
.levels .num { width: 52px; text-align: right; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .75rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
.chart { width: 100%; height: auto; display: block; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; margin-top: 6px; }
th, td { text-align: right; padding: 3px 6px; } th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 500; }

.card .hanzi-row { padding-block: 10px; gap: 14px; }
.hanzi { font-size: 4rem; line-height: 1.1; font-weight: 500; }
.hanzi-md { font-size: 2.6rem; }
.hanzi-sm { font-size: 2rem; display: block; }
.details { display: flex; flex-direction: column; gap: 12px; }
.reading .py { color: var(--ink-2); }
.reading .zy { color: var(--ink-2); letter-spacing: .02em; }
.reading.big { font-size: 1.25rem; }
.reading.small { font-size: .85rem; }
.reading.center { text-align: center; }
.meaning { text-align: center; font-size: 1.1rem; font-weight: 600; }
.example { display: flex; gap: 10px; align-items: flex-start; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.ex-body { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ex-zh { font-size: 1.15rem; }
.ratings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rate { border: 0; border-radius: 12px; padding: 12px 4px; color: #fff; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .9rem; }
.rate small { font-weight: 400; font-size: .72rem; opacity: .9; }
.rate.r1 { background: var(--t1); } .rate.r2 { background: var(--t2); } .rate.r3 { background: var(--t3); } .rate.r4 { background: var(--t4); }
:root:not([data-theme="light"]) .rate { color: #fff; }
.empty { display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; padding-block: 24px; }
.big-emoji { font-size: 3rem; }
.score { font-size: 2.4rem; font-weight: 700; }

.stage { align-items: center; text-align: center; padding-block: 24px; }
.feedback { display: flex; flex-direction: column; gap: 6px; align-items: center; width: 100%; }
.tone-btns { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.tone-btn { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 600; font-size: .85rem; }
.tone-btn.right { border-color: var(--jade); background: var(--jade-soft); }
.tone-btn.wrong { border-color: var(--t1); }
.pair-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pair { border: 2px solid var(--line); background: var(--card); border-radius: 12px; overflow: hidden; }
.pair.right { border-color: var(--jade); background: var(--jade-soft); }
.pair.wrong { border-color: var(--t1); }
.pair > button:first-child { width: 100%; border: 0; background: none; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.compare { width: 100%; border: 0; border-top: 1px solid var(--line); background: none; padding: 6px; font-size: .75rem; color: var(--ink-2); }
.ex-list { display: flex; flex-direction: column; gap: 10px; }
.panel.ex { flex-direction: row; align-items: center; gap: 14px; }
.ex-zh-big { width: 96px; flex-shrink: 0; text-align: center; font-size: 1.5rem; color: var(--accent); }
.shadow-zh { font-size: 1.8rem; line-height: 1.35; }
.three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.file-btn { cursor: pointer; }

.input { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; }
.words { list-style: none; margin: 0; }
.words li + li { border-top: 1px solid var(--line); }
.word-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
.word-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; border: 0; background: none; text-align: left; padding: 0; }
.word-zh { width: 76px; flex-shrink: 0; font-size: 1.5rem; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: var(--line); }
.dot.learning { background: var(--t2); } .dot.learned { background: var(--jade); }
.word-open { padding: 14px 12px; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--paper) 60%, var(--card)); display: flex; flex-direction: column; gap: 10px; }

.form { gap: 4px; }
.opt { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 8px; }
.opt input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); }
.opt select, .num-input { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 5px 8px; max-width: 60%; }
.num-input { width: 72px; text-align: right; }
.list { padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
details summary { cursor: pointer; color: var(--ink-2); }
@media (min-width: 640px) { .hide-sm { display: block; } }
@media (max-width: 639px) { .hide-sm { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header><div class="wrap">
  <a class="brand" href="#today"><span class="han" lang="zh-TW">華語</span>Taiwan Tutor</a>
  <div class="head-r">
    <span id="sync" role="status">Loading…</span>
    <button id="t-py" class="toggle" data-act="toggle-py" aria-pressed="true">Pinyin</button>
    <button id="t-zy" class="toggle" data-act="toggle-zy" aria-pressed="true" lang="zh-TW">ㄅㄆㄇ</button>
  </div>
</div></header>
<main class="wrap" id="view"><p class="muted">Loading your tutor…</p></main>
<nav aria-label="Main"><div class="wrap">
  <a href="#today"><span class="ic" lang="zh-TW">今</span>Today</a>
  <a href="#review"><span class="ic" lang="zh-TW">卡</span>Review</a>
  <a href="#tones"><span class="ic" lang="zh-TW">聲</span>Tones</a>
  <a href="#words"><span class="ic" lang="zh-TW">字</span>Words</a>
  <a href="#options"><span class="ic" lang="zh-TW">設</span>Options</a>
</div></nav>
<script>/*APP*/</script>
