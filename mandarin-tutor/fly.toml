# Fly.io config. One machine + one volume (SQLite can't be shared between machines).
#   fly launch --no-deploy --copy-config      (pick your own app name)
#   fly volumes create tutor_data --size 1 --region nrt
#   fly secrets set ADMIN_EMAIL=you@example.com APP_URL=https://<app>.fly.dev RESEND_API_KEY=... EMAIL_FROM="Taiwan Tutor <login@yourdomain.com>"
#   fly deploy
app = "taiwan-mandarin-tutor"
primary_region = "nrt"

[build]

[env]
  PORT = "3000"
  DATABASE_URL = "file:/data/app.db"

[mounts]
  source = "tutor_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
